<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090e" />
    <script>
      (function() {
        const pref = localStorage.getItem('theme-preference');
        if (pref === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Rabinarayan Asha | Senior Java & Microservices Developer Portfolio</title>
    <meta name="title" content="Rabinarayan Asha | Senior Java & Microservices Developer Portfolio" />

    <meta name="keywords" content="Rabinarayan Asha, Java Developer, Spring Boot, Apache Kafka, Microservices, React.js, Hibernate, Infosys, Full Stack Developer, Software Engineer" />
    <meta name="author" content="Rabinarayan Asha" />
